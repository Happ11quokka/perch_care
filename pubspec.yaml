name: perch_care
description: "AI 기반 반려동물 건강 관리 앱"
publish_to: "none"
version: 2.1.0+5

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_svg: ^2.0.10+1
  go_router: ^14.6.2
  fl_chart: ^0.68.0
  flutter_dotenv: ^5.1.0
  http: ^1.2.2
  http_parser: ^4.1.0
  shared_preferences: ^2.3.2
  image_picker: ^1.2.1
  image_cropper: ^8.0.2
  flutter_secure_storage: ^10.0.0
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  firebase_analytics: ^11.4.2
  in_app_review: ^2.0.10
  share_plus: ^10.1.4
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.3.2
  flutter_markdown: ^0.7.6
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_1024_flat.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - .env
    - assets/images/login_vector/
    - assets/images/btn_google/
    - assets/images/btn_apple/

    - assets/images/signup_vector/
    - assets/images/home_vector/
    - assets/images/profile/
    # OFL은 폰트 배포 시 라이선스 동봉을 요구한다 — 앱 번들에 함께 넣는다.
    - assets/fonts/LICENSE-Pretendard.txt

  # Pretendard (SIL Open Font License 1.1) — assets/fonts/LICENSE-Pretendard.txt
  # AppTypography.fontFamily가 지정하는 서체. 등록하지 않으면 시스템 서체로
  # 대체되어 디자인 시안과 자간·굵기가 달라진다.
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
